api-rastploy-deploy:
  extends: [.rastploy-deploy, .backend-api-release-rules]
  dependencies: []
  variables:
    IMAGE_TARGET: api

media-rastploy-deploy:
  extends: [.rastploy-deploy, .backend-media-release-rules]
  dependencies: []
  variables:
    IMAGE_TARGET: media

worker-rastploy-deploy:
  extends: [.rastploy-deploy, .backend-worker-release-rules]
  dependencies: []
  variables:
    IMAGE_TARGET: worker

web-rastploy-deploy:
  extends: [.rastploy-deploy, .frontend-release-rules]
  dependencies: []
  variables:
    IMAGE_TARGET: web

rastploy-deploy-check:
  stage: test
  image: hub.hamdocker.ir/library/alpine:3.22
  before_script:
    - apk add --no-cache python3 jq shellcheck
  script:
    - shellcheck ci/rastploy-deploy.sh
    - python3 -m unittest discover -s ci/tests -p 'test_rastploy_deploy.py'
  rules:
    - if: '$CI_COMMIT_TAG =~ $RELEASE_TAG_PATTERN'
    - if: '$CI_COMMIT_TAG'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "web" || $CI_PIPELINE_SOURCE == "schedule"'
    - changes:
        - ci/**/*
        - .gitlab-ci.yml
