release-verify:
  stage: lint
  image: hub.hamdocker.ir/library/alpine:3.22
  variables:
    GIT_DEPTH: "0"
  script:
    - apk add --no-cache git
    - git fetch --no-tags origin "+refs/heads/$CI_DEFAULT_BRANCH:refs/remotes/origin/$CI_DEFAULT_BRANCH"
    - git merge-base --is-ancestor "$CI_COMMIT_SHA" "origin/$CI_DEFAULT_BRANCH"
  rules:
    - if: '$CI_COMMIT_TAG =~ $RELEASE_TAG_PATTERN'
