# Retry production CD for release images whose original build and publish passed.
# This lane runs only on the protected default branch, selected by workflow rules.
rastploy-redeploy-check:
  stage: test
  image: hub.hamdocker.ir/library/alpine:3.22
  before_script:
    - apk add --no-cache python3 jq shellcheck
  script:
    - shellcheck ci/rastploy-deploy.sh
    - python3 -m unittest discover -s ci/tests -p 'test_rastploy_deploy.py'

api-rastploy-redeploy:
  extends: .rastploy-deploy
  dependencies: []
  variables:
    IMAGE_TARGET: api
  script:
    - export CI_COMMIT_TAG="$MAHFEL_REDEPLOY_API_TAG"
    - sh ci/rastploy-deploy.sh
  rules:
    - if: '$MAHFEL_REDEPLOY_API_TAG =~ $API_RELEASE_TAG_PATTERN'

