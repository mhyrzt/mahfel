include:
  - local: ci/common.yml
  - local: ci/darkube.yml
  - local: ci/release.yml
  - local: ci/proto.yml
  - local: backend/.gitlab-ci.yml
  - local: frontend/.gitlab-ci.yml
  - local: docs/.gitlab-ci.yml

stages:
  - lint
  - test
  - build
  - security
  - publish
  - deploy
  - docs

default:
  interruptible: true

workflow:
  auto_cancel:
    on_new_commit: interruptible
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes: &pipeline-changes
        - backend/**/*
        - frontend/**/*
        - proto/**/*
        - specs/**/*
        - ci/**/*
        - deploy/keycloak/**/*
        - docs/**/*
        - mkdocs.yml
        - .gitlab-ci.yml
        - .dockerignore
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS && $CI_COMMIT_BRANCH != $CI_DEFAULT_BRANCH'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH'
      changes: *pipeline-changes
    - if: '$CI_COMMIT_TAG =~ $RELEASE_TAG_PATTERN'
    - if: '$CI_COMMIT_TAG'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "web" || $CI_PIPELINE_SOURCE == "schedule"'
    - when: never
