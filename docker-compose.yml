name: mahfel

services:
  mahfel-web:
    image: mahfel-web:local
    build:
      context: .
      dockerfile: deploy/docker/web.Dockerfile
      args:
        NEXT_PUBLIC_MAHFEL_API_URL: ${NEXT_PUBLIC_MAHFEL_API_URL:-http://localhost:8080}
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      mahfel-api:
        condition: service_healthy
    networks: [edge, internal]

  mahfel-api:
    image: mahfel-api:local
    build:
      context: .
      dockerfile: deploy/docker/api.Dockerfile
    restart: unless-stopped
    environment:
      MAHFEL_API__DATABASE_URL: ${MAHFEL_DATABASE_URL:-postgres://mahfel:mahfel-local-only@postgres:5432/mahfel}
      MAHFEL_API__MEDIA_GRPC_URL: http://mahfel-media:50051
      MAHFEL_API__ALLOWED_ORIGIN: http://localhost:3000
      MAHFEL_TELEMETRY__LOG_FILTER: ${MAHFEL_LOG_FILTER:-info,mahfel=debug,tower_http=info}
    ports:
      - "8080:8080"
      - "127.0.0.1:9101:9101"
    depends_on:
      postgres:
        condition: service_healthy
      mahfel-media:
        condition: service_healthy
    networks: [edge, internal]

  mahfel-media:
    image: mahfel-media:local
    build:
      context: .
      dockerfile: deploy/docker/media.Dockerfile
    restart: unless-stopped
    environment:
      MAHFEL_MEDIA__ANNOUNCED_ADDRESS: ${MAHFEL_MEDIA_ANNOUNCED_ADDRESS:-127.0.0.1}
      MAHFEL_MEDIA__RTC_PORT_MIN: ${MAHFEL_MEDIA_RTC_PORT_MIN:-40000}
      MAHFEL_MEDIA__RTC_PORT_MAX: ${MAHFEL_MEDIA_RTC_PORT_MAX:-40003}
      MAHFEL_MEDIA__WORKER_COUNT: ${MAHFEL_MEDIA_WORKER_COUNT:-4}
      MAHFEL_TELEMETRY__LOG_FILTER: ${MAHFEL_LOG_FILTER:-info,mahfel=debug}
    expose:
      - "50051"
    ports:
      - "127.0.0.1:9102:9102"
      - "${MAHFEL_MEDIA_RTC_PORT_MIN:-40000}-${MAHFEL_MEDIA_RTC_PORT_MAX:-40003}:${MAHFEL_MEDIA_RTC_PORT_MIN:-40000}-${MAHFEL_MEDIA_RTC_PORT_MAX:-40003}/udp"
      - "${MAHFEL_MEDIA_RTC_PORT_MIN:-40000}-${MAHFEL_MEDIA_RTC_PORT_MAX:-40003}:${MAHFEL_MEDIA_RTC_PORT_MIN:-40000}-${MAHFEL_MEDIA_RTC_PORT_MAX:-40003}/tcp"
    networks: [edge, internal]

  mahfel-worker:
    image: mahfel-worker:local
    build:
      context: .
      dockerfile: deploy/docker/worker.Dockerfile
    restart: unless-stopped
    environment:
      MAHFEL_WORKER__AMQP_URL: ${MAHFEL_AMQP_URL:-amqp://mahfel:mahfel-local-only@rabbitmq:5672/%2f}
      MAHFEL_TELEMETRY__LOG_FILTER: ${MAHFEL_LOG_FILTER:-info,mahfel=debug}
    ports:
      - "127.0.0.1:9103:9103"
    depends_on:
      rabbitmq:
        condition: service_healthy
    networks: [internal, admin]

  postgres:
    image: postgres:16-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${MAHFEL_POSTGRES_DB:-mahfel}
      POSTGRES_USER: ${MAHFEL_POSTGRES_USER:-mahfel}
      POSTGRES_PASSWORD: ${MAHFEL_POSTGRES_PASSWORD:-mahfel-local-only}
    ports:
      - "127.0.0.1:${MAHFEL_POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [internal, admin]

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "no", "--save", ""]
    ports:
      - "127.0.0.1:${MAHFEL_REDIS_HOST_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [internal, admin]

  rabbitmq:
    image: rabbitmq:4.2-management-alpine
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${MAHFEL_RABBITMQ_USER:-mahfel}
      RABBITMQ_DEFAULT_PASS: ${MAHFEL_RABBITMQ_PASSWORD:-mahfel-local-only}
    ports:
      - "127.0.0.1:${MAHFEL_RABBITMQ_AMQP_HOST_PORT:-5672}:5672"
      - "127.0.0.1:${MAHFEL_RABBITMQ_MANAGEMENT_HOST_PORT:-15672}:15672"
      - "127.0.0.1:${MAHFEL_RABBITMQ_METRICS_HOST_PORT:-15692}:15692"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
      - ./deploy/rabbitmq/enabled_plugins:/etc/rabbitmq/enabled_plugins:ro
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 12
    networks: [internal, admin]

  minio:
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
    restart: unless-stopped
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MAHFEL_MINIO_ROOT_USER:-mahfel}
      MINIO_ROOT_PASSWORD: ${MAHFEL_MINIO_ROOT_PASSWORD:-mahfel-local-only-secret}
    ports:
      - "127.0.0.1:${MAHFEL_MINIO_API_HOST_PORT:-9000}:9000"
      - "127.0.0.1:${MAHFEL_MINIO_CONSOLE_HOST_PORT:-9001}:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [internal, admin]

  minio-init:
    image: quay.io/minio/mc:RELEASE.2025-08-13T08-35-41Z
    restart: "no"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        mc alias set local http://minio:9000 "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}" &&
        mc mb --ignore-existing "local/$${MINIO_BUCKET}"
    environment:
      MINIO_ROOT_USER: ${MAHFEL_MINIO_ROOT_USER:-mahfel}
      MINIO_ROOT_PASSWORD: ${MAHFEL_MINIO_ROOT_PASSWORD:-mahfel-local-only-secret}
      MINIO_BUCKET: ${MAHFEL_S3_BUCKET:-mahfel-local}
    depends_on:
      minio:
        condition: service_healthy
    networks: [internal]

  coturn:
    image: coturn/coturn:4.7.0-r0
    restart: unless-stopped
    command:
      - --log-file=stdout
      - --fingerprint
      - --lt-cred-mech
      - --realm=${MAHFEL_TURN_REALM:-mahfel.local}
      - --user=${MAHFEL_TURN_USER:-mahfel}:${MAHFEL_TURN_PASSWORD:-mahfel-local-only}
      - --external-ip=${MAHFEL_TURN_EXTERNAL_IP:-127.0.0.1}
      - --min-port=${MAHFEL_TURN_RELAY_MIN_PORT:-49160}
      - --max-port=${MAHFEL_TURN_RELAY_MAX_PORT:-49200}
      - --no-tls
      - --no-dtls
    ports:
      - "3478:3478/udp"
      - "3478:3478/tcp"
      - "${MAHFEL_TURN_RELAY_MIN_PORT:-49160}-${MAHFEL_TURN_RELAY_MAX_PORT:-49200}:${MAHFEL_TURN_RELAY_MIN_PORT:-49160}-${MAHFEL_TURN_RELAY_MAX_PORT:-49200}/udp"
    networks: [edge]

  prometheus:
    image: prom/prometheus:v3.5.0
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
    ports:
      - "127.0.0.1:${MAHFEL_PROMETHEUS_HOST_PORT:-9090}:9090"
    volumes:
      - ./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./deploy/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
    depends_on:
      mahfel-api:
        condition: service_healthy
      mahfel-media:
        condition: service_healthy
      mahfel-worker:
        condition: service_healthy
    networks: [internal, admin]

  alertmanager:
    image: prom/alertmanager:v0.28.1
    restart: unless-stopped
    command: ["--config.file=/etc/alertmanager/alertmanager.yml"]
    ports:
      - "127.0.0.1:${MAHFEL_ALERTMANAGER_HOST_PORT:-9093}:9093"
    volumes:
      - ./deploy/prometheus/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    networks: [internal, admin]

  grafana:
    image: grafana/grafana:12.1.1
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${MAHFEL_GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${MAHFEL_GRAFANA_ADMIN_PASSWORD:-mahfel-local-only}
      GF_USERS_ALLOW_SIGN_UP: "false"
    ports:
      - "127.0.0.1:${MAHFEL_GRAFANA_HOST_PORT:-3300}:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus
    networks: [internal, admin]

networks:
  edge:
  admin:
  internal:
    internal: true

volumes:
  postgres-data:
  rabbitmq-data:
  minio-data:
  grafana-data:
