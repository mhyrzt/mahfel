name: mahfel

services:
  mahfel-web:
    profiles: [mahfel]
    image: mahfel-web:local
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        NEXT_PUBLIC_MAHFEL_API_URL: ${NEXT_PUBLIC_MAHFEL_API_URL:-https://api.mahfel.localhost}
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      mahfel-api:
        condition: service_healthy
    networks: [edge, internal]

  mahfel-api:
    profiles: [mahfel]
    image: mahfel-api:local
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: api
    restart: unless-stopped
    environment:
      MAHFEL_DATABASE__HOST: postgres
      MAHFEL_DATABASE__PORT: 5432
      MAHFEL_DATABASE__USER: ${MAHFEL_POSTGRES_USER:-mahfel}
      MAHFEL_DATABASE__PASSWORD: ${MAHFEL_POSTGRES_PASSWORD:-mahfel-local-only}
      MAHFEL_DATABASE__NAME: ${MAHFEL_POSTGRES_DB:-mahfel}
      MAHFEL_DATABASE__MIGRATE_ON_START: "true"
      MAHFEL_CONFIG_PROFILE: docker
      MAHFEL_API__MEDIA_GRPC_URL: http://mahfel-media:50051
      MAHFEL_API__ALLOWED_ORIGIN: https://mahfel.localhost
      MAHFEL_TELEMETRY__LOG_FILTER: ${MAHFEL_LOG_FILTER:-info,mahfel=debug,tower_http=info}
    ports:
      - "127.0.0.1:8080:8080"
      - "127.0.0.1:9101:9101"
    depends_on:
      postgres:
        condition: service_healthy
      mahfel-media:
        condition: service_healthy
    networks: [edge, internal]

  mahfel-media:
    profiles: [mahfel]
    image: mahfel-media:local
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: media
    restart: unless-stopped
    environment:
      MAHFEL_MEDIA__ANNOUNCED_ADDRESS: ${MAHFEL_MEDIA_ANNOUNCED_ADDRESS:-127.0.0.1}
      MAHFEL_MEDIA__RTC_PORT_MIN: ${MAHFEL_MEDIA_RTC_PORT_MIN:-40000}
      MAHFEL_MEDIA__RTC_PORT_MAX: ${MAHFEL_MEDIA_RTC_PORT_MAX:-40003}
      MAHFEL_MEDIA__WORKER_COUNT: ${MAHFEL_MEDIA_WORKER_COUNT:-4}
      MAHFEL_TELEMETRY__LOG_FILTER: ${MAHFEL_LOG_FILTER:-info,mahfel=debug}
    expose:
      - "50051"
    ports:
      - "127.0.0.1:${MAHFEL_MEDIA_GRPC_HOST_PORT:-50051}:50051"
      - "127.0.0.1:9102:9102"
      - "${MAHFEL_MEDIA_RTC_PORT_MIN:-40000}-${MAHFEL_MEDIA_RTC_PORT_MAX:-40003}:${MAHFEL_MEDIA_RTC_PORT_MIN:-40000}-${MAHFEL_MEDIA_RTC_PORT_MAX:-40003}/udp"
      - "${MAHFEL_MEDIA_RTC_PORT_MIN:-40000}-${MAHFEL_MEDIA_RTC_PORT_MAX:-40003}:${MAHFEL_MEDIA_RTC_PORT_MIN:-40000}-${MAHFEL_MEDIA_RTC_PORT_MAX:-40003}/tcp"
    networks: [edge, internal]

  mahfel-worker:
    profiles: [mahfel]
    image: mahfel-worker:local
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: worker
    restart: unless-stopped
    environment:
      MAHFEL_WORKER__AMQP_URL: ${MAHFEL_AMQP_URL:-amqp://mahfel:mahfel-local-only@rabbitmq:5672/%2f}
      MAHFEL_TELEMETRY__LOG_FILTER: ${MAHFEL_LOG_FILTER:-info,mahfel=debug}
    ports:
      - "127.0.0.1:9103:9103"
    depends_on:
      rabbitmq:
        condition: service_healthy
    networks: [internal, admin]

  caddy:
    profiles: [infrastructure]
    image: docker.arvancloud.ir/caddy:2.11.4-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:${MAHFEL_CADDY_HTTP_HOST_PORT:-80}:80"
      - "127.0.0.1:${MAHFEL_CADDY_HTTPS_HOST_PORT:-443}:443"
    volumes:
      - ./deploy/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    environment:
      MAHFEL_CADDY_WEB_UPSTREAM: ${MAHFEL_CADDY_WEB_UPSTREAM:-mahfel-web:3000}
      MAHFEL_CADDY_API_UPSTREAM: ${MAHFEL_CADDY_API_UPSTREAM:-mahfel-api:8080}
    extra_hosts:
      - host.docker.internal:host-gateway
    depends_on:
      rustfs:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      dex:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:2019/config/"]
      interval: 10s
      timeout: 3s
      retries: 10
    networks: [edge, internal]

  postgres:
    profiles: [infrastructure]
    image: docker.arvancloud.ir/postgres:16-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${MAHFEL_POSTGRES_DB:-mahfel}
      POSTGRES_USER: ${MAHFEL_POSTGRES_USER:-mahfel}
      POSTGRES_PASSWORD: ${MAHFEL_POSTGRES_PASSWORD:-mahfel-local-only}
    ports:
      - "127.0.0.1:${MAHFEL_POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [internal, admin]

  redis:
    profiles: [infrastructure]
    image: docker.arvancloud.ir/redis:7.4-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "no", "--save", ""]
    ports:
      - "127.0.0.1:${MAHFEL_REDIS_HOST_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [internal, admin]

  rabbitmq:
    profiles: [infrastructure]
    image: docker.arvancloud.ir/rabbitmq:4.2-management-alpine
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${MAHFEL_RABBITMQ_USER:-mahfel}
      RABBITMQ_DEFAULT_PASS: ${MAHFEL_RABBITMQ_PASSWORD:-mahfel-local-only}
    command:
      - sh
      - -c
      - >-
        rabbitmq-plugins enable --offline rabbitmq_management rabbitmq_prometheus &&
        exec rabbitmq-server
    ports:
      - "127.0.0.1:${MAHFEL_RABBITMQ_AMQP_HOST_PORT:-5672}:5672"
      - "127.0.0.1:${MAHFEL_RABBITMQ_MANAGEMENT_HOST_PORT:-15672}:15672"
      - "127.0.0.1:${MAHFEL_RABBITMQ_METRICS_HOST_PORT:-15692}:15692"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 12
    networks: [internal, admin]

  rustfs:
    profiles: [infrastructure]
    image: docker.arvancloud.ir/rustfs/rustfs:1.0.0-rc.6
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    environment:
      RUSTFS_VOLUMES: /data
      RUSTFS_ADDRESS: 0.0.0.0:9000
      RUSTFS_CONSOLE_ADDRESS: 0.0.0.0:9001
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_ACCESS_KEY: ${MAHFEL_S3_ACCESS_KEY:-mahfel}
      RUSTFS_SECRET_KEY: ${MAHFEL_S3_SECRET_KEY:-mahfel-local-only-secret}
      RUSTFS_OBS_LOGGER_LEVEL: info
    ports:
      - "127.0.0.1:${MAHFEL_RUSTFS_API_HOST_PORT:-9000}:9000"
      - "127.0.0.1:${MAHFEL_RUSTFS_CONSOLE_HOST_PORT:-9001}:9001"
    volumes:
      - rustfs-data:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9000/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    networks: [internal, admin]

  rustfs-init:
    profiles: [infrastructure]
    image: docker.arvancloud.ir/amazon/aws-cli:2.36.46
    restart: "no"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        aws --endpoint-url http://rustfs:9000 s3api head-bucket --bucket "$${S3_BUCKET}" 2>/dev/null ||
        aws --endpoint-url http://rustfs:9000 s3api create-bucket --bucket "$${S3_BUCKET}"
    environment:
      AWS_ACCESS_KEY_ID: ${MAHFEL_S3_ACCESS_KEY:-mahfel}
      AWS_SECRET_ACCESS_KEY: ${MAHFEL_S3_SECRET_KEY:-mahfel-local-only-secret}
      AWS_DEFAULT_REGION: ${MAHFEL_S3_REGION:-us-east-1}
      AWS_EC2_METADATA_DISABLED: "true"
      S3_BUCKET: ${MAHFEL_S3_BUCKET:-mahfel-local}
    depends_on:
      rustfs:
        condition: service_healthy
    networks: [internal]

  dex:
    profiles: [infrastructure]
    image: ghcr.io/dexidp/dex:v2.41.1
    restart: unless-stopped
    command: ["dex", "serve", "/etc/dex/config.yaml"]
    ports:
      - "127.0.0.1:${MAHFEL_DEX_HOST_PORT:-5556}:5556"
    volumes:
      - ./deploy/dex/config.yaml:/etc/dex/config.yaml:ro
      - dex-data:/var/dex
    networks: [edge, internal]

  coturn:
    profiles: [infrastructure]
    image: docker.arvancloud.ir/coturn/coturn:4.7.0-r0
    restart: unless-stopped
    command:
      - --log-file=stdout
      - --fingerprint
      - --lt-cred-mech
      - --realm=${MAHFEL_TURN_REALM:-mahfel.local}
      - --user=${MAHFEL_TURN_USER:-mahfel}:${MAHFEL_TURN_PASSWORD:-mahfel-local-only}
      - --external-ip=${MAHFEL_TURN_EXTERNAL_IP:-127.0.0.1}
      - --min-port=${MAHFEL_TURN_RELAY_MIN_PORT:-49160}
      - --max-port=${MAHFEL_TURN_RELAY_MAX_PORT:-49200}
      - --no-tls
      - --no-dtls
    ports:
      - "3478:3478/udp"
      - "3478:3478/tcp"
      - "${MAHFEL_TURN_RELAY_MIN_PORT:-49160}-${MAHFEL_TURN_RELAY_MAX_PORT:-49200}:${MAHFEL_TURN_RELAY_MIN_PORT:-49160}-${MAHFEL_TURN_RELAY_MAX_PORT:-49200}/udp"
    networks: [edge]

  prometheus:
    profiles: [observability]
    image: docker.arvancloud.ir/prom/prometheus:v3.5.0
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
    ports:
      - "127.0.0.1:${MAHFEL_PROMETHEUS_HOST_PORT:-9090}:9090"
    volumes:
      - ./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./deploy/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
    depends_on:
      mahfel-api:
        condition: service_healthy
      mahfel-media:
        condition: service_healthy
      mahfel-worker:
        condition: service_healthy
    networks: [internal, admin]

  alertmanager:
    profiles: [observability]
    image: docker.arvancloud.ir/prom/alertmanager:v0.28.1
    restart: unless-stopped
    command: ["--config.file=/etc/alertmanager/alertmanager.yml"]
    ports:
      - "127.0.0.1:${MAHFEL_ALERTMANAGER_HOST_PORT:-9093}:9093"
    volumes:
      - ./deploy/prometheus/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    networks: [internal, admin]

  grafana:
    profiles: [observability]
    image: docker.arvancloud.ir/grafana/grafana:12.1.1
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${MAHFEL_GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${MAHFEL_GRAFANA_ADMIN_PASSWORD:-mahfel-local-only}
      GF_USERS_ALLOW_SIGN_UP: "false"
    ports:
      - "127.0.0.1:${MAHFEL_GRAFANA_HOST_PORT:-3300}:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus
    networks: [internal, admin]

networks:
  edge:
  admin:
  internal:
    internal: true

volumes:
  caddy-data:
  caddy-config:
  postgres-data:
  rabbitmq-data:
  rustfs-data:
  grafana-data:
  dex-data:
