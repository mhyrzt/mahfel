syntax = "proto3";

package mahfel.media.v1;

message CreateRoomRequest {
  string room_id = 1;
}

message CreateRoomResponse {
  string room_id = 1;
}

message DeleteRoomRequest {
  string room_id = 1;
}

message DeleteRoomResponse {}

// Close volatile media from an ended session while retaining the room router.
message ClearRoomMediaRequest {
  string room_id = 1;
}

message ClearRoomMediaResponse {}
