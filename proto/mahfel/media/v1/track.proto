syntax = "proto3";

package mahfel.media.v1;

message ProduceRequest {
  string room_id = 1;
  string participant_id = 2;
  string transport_id = 3;
  string kind = 4;
  string rtp_parameters = 5;
  string source = 6;
}

message ProduceResponse {
  string producer_id = 1;
}

message ConsumeRequest {
  string room_id = 1;
  string participant_id = 2;
  string producer_id = 3;
  string transport_id = 4;
  string rtp_capabilities = 5;
}

message ConsumeResponse {
  string consumer_id = 1;
  string rtp_parameters = 2;
  bool paused = 3;
}

message PauseProducerRequest {
  string room_id = 1;
  string producer_id = 2;
}

message PauseProducerResponse {}

message PauseParticipantSourceRequest {
  string room_id = 1;
  string participant_id = 2;
  string source = 3;
}

message PauseParticipantSourceResponse {
  uint32 affected = 1;
}

message ResumeParticipantSourceRequest {
  string room_id = 1;
  string participant_id = 2;
  // "microphone" | "camera" | "screen"
  string source = 3;
}

message ResumeParticipantSourceResponse {
  uint32 affected = 1;
}

message CloseParticipantSourceRequest {
  string room_id = 1;
  string participant_id = 2;
  // "microphone" | "camera" | "screen"
  string source = 3;
}

// How many producers were closed. Zero is normal when the participant has
// published nothing of that source.
message CloseParticipantSourceResponse {
  uint32 closed = 1;
}

message CloseParticipantResponse {
  // How many producers were closed. Zero is normal for a silent participant.
  uint32 closed = 1;
}

message ResumeProducerRequest {
  string room_id = 1;
  string producer_id = 2;
}

message ResumeProducerResponse {}

message PauseConsumerRequest {
  string room_id = 1;
  string consumer_id = 2;
}

message PauseConsumerResponse {}

message ResumeConsumerRequest {
  string room_id = 1;
  string consumer_id = 2;
}

message ResumeConsumerResponse {}

message CloseParticipantRequest {
  string room_id = 1;
  string participant_id = 2;
}
