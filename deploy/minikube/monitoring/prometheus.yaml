apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s

    scrape_configs:
      - job_name: prometheus
        static_configs:
          - targets: ["localhost:9090"]
      - job_name: mahfel-api
        static_configs:
          - targets: ["mahfel-api:9101"]
      - job_name: mahfel-media
        static_configs:
          - targets: ["mahfel-media:9102"]
      - job_name: mahfel-worker
        static_configs:
          - targets: ["mahfel-worker:9103"]
      - job_name: kube-state-metrics
        static_configs:
          - targets: ["kube-state-metrics:8080"]
      - job_name: node-exporter
        static_configs:
          - targets: ["node-exporter:9100"]
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: prometheus-data
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
spec:
  replicas: 1
  selector:
    matchLabels: { app: prometheus }
  template:
    metadata:
      labels: { app: prometheus }
    spec:
      containers:
        - name: prometheus
          image: docker.arvancloud.ir/prom/prometheus:v3.14.0
          args:
            - --config.file=/etc/prometheus/prometheus.yml
            - --storage.tsdb.path=/prometheus
            - --storage.tsdb.retention.time=7d
            - --web.enable-lifecycle
          ports:
            - name: http
              containerPort: 9090
          readinessProbe:
            httpGet: { path: /-/ready, port: http }
            periodSeconds: 5
          volumeMounts:
            - { name: data, mountPath: /prometheus }
            - {
                name: config,
                mountPath: /etc/prometheus/prometheus.yml,
                subPath: prometheus.yml,
                readOnly: true,
              }
      volumes:
        - { name: data, persistentVolumeClaim: { claimName: prometheus-data } }
        - { name: config, configMap: { name: prometheus-config } }
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
spec:
  selector: { app: prometheus }
  ports:
    - name: http
      port: 9090
      targetPort: http
