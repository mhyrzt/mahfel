apiVersion: v1
kind: ServiceAccount
metadata:
  name: alloy
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: mahfel-alloy
rules:
  - apiGroups: ['']
    resources: [pods, pods/log, namespaces]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: mahfel-alloy
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: mahfel-alloy
subjects:
  - kind: ServiceAccount
    name: alloy
    namespace: mahfel
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: alloy-config
data:
  config.alloy: |
    logging {
      level  = "info"
      format = "json"
    }

    discovery.kubernetes "pods" {
      role = "pod"
    }

    discovery.relabel "mahfel_pods" {
      targets = discovery.kubernetes.pods.targets

      rule {
        source_labels = ["__meta_kubernetes_namespace"]
        regex         = "mahfel"
        action        = "keep"
      }
    }

    loki.source.kubernetes "pods" {
      targets    = discovery.relabel.mahfel_pods.output
      forward_to = [loki.write.local.receiver]
    }

    loki.write "local" {
      endpoint {
        url = "http://loki:3100/loki/api/v1/push"
      }
    }

    otelcol.receiver.otlp "default" {
      grpc {
        endpoint = "0.0.0.0:4317"
      }
      http {
        endpoint = "0.0.0.0:4318"
      }
      output {
        logs   = [otelcol.exporter.loki.default.input]
        traces = [otelcol.exporter.otlp.tempo.input]
      }
    }

    otelcol.exporter.loki "default" {
      forward_to = [loki.write.local.receiver]
    }

    otelcol.exporter.otlp "tempo" {
      client {
        endpoint = "tempo:4317"
        tls {
          insecure = true
        }
      }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: alloy
spec:
  replicas: 1
  selector:
    matchLabels: {app: alloy}
  template:
    metadata:
      labels: {app: alloy}
    spec:
      serviceAccountName: alloy
      containers:
        - name: alloy
          image: docker.arvancloud.ir/grafana/alloy:v1.10.2
          args: [run, /etc/alloy/config.alloy, --storage.path=/var/lib/alloy]
          ports:
            - {name: otlp-grpc, containerPort: 4317}
            - {name: otlp-http, containerPort: 4318}
          readinessProbe:
            httpGet: {path: /-/ready, port: 12345}
            periodSeconds: 5
          volumeMounts:
            - {name: config, mountPath: /etc/alloy/config.alloy, subPath: config.alloy, readOnly: true}
            - {name: storage, mountPath: /var/lib/alloy}
      volumes:
        - {name: config, configMap: {name: alloy-config}}
        - {name: storage, emptyDir: {}}
---
apiVersion: v1
kind: Service
metadata:
  name: alloy
spec:
  selector: {app: alloy}
  ports:
    - {name: otlp-grpc, port: 4317, targetPort: otlp-grpc}
    - {name: otlp-http, port: 4318, targetPort: otlp-http}
