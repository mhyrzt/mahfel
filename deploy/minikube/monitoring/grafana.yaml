apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasources
data:
  datasources.yaml: |
    apiVersion: 1
    datasources:
      - name: Loki
        uid: loki
        type: loki
        access: proxy
        url: http://loki:3100
        isDefault: true
        jsonData:
          maxLines: 1000
      - name: Prometheus
        uid: prometheus
        type: prometheus
        access: proxy
        url: http://prometheus:9090
        isDefault: false
      - name: Tempo
        uid: tempo
        type: tempo
        access: proxy
        url: http://tempo:3200
        jsonData:
          tracesToLogs:
            datasourceUid: loki
            tags: ["service.name", "service.namespace", "deployment.environment"]
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: grafana-data
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 2Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
spec:
  replicas: 1
  selector:
    matchLabels: { app: grafana }
  template:
    metadata:
      labels: { app: grafana }
    spec:
      containers:
        - name: grafana
          image: docker.arvancloud.ir/grafana/grafana:12.1.1
          env:
            - { name: GF_SECURITY_ADMIN_USER, value: admin }
            - { name: GF_SECURITY_ADMIN_PASSWORD, value: mahfel-local-only }
            - { name: GF_USERS_ALLOW_SIGN_UP, value: "false" }
          ports:
            - name: http
              containerPort: 3000
          readinessProbe:
            httpGet: { path: /api/health, port: http }
            periodSeconds: 5
          volumeMounts:
            - { name: data, mountPath: /var/lib/grafana }
            - {
                name: datasources,
                mountPath: /etc/grafana/provisioning/datasources,
                readOnly: true,
              }
      volumes:
        - { name: data, persistentVolumeClaim: { claimName: grafana-data } }
        - { name: datasources, configMap: { name: grafana-datasources } }
---
apiVersion: v1
kind: Service
metadata:
  name: grafana
spec:
  selector: { app: grafana }
  ports:
    - name: http
      port: 3000
      targetPort: http
