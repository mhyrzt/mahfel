apiVersion: apps/v1
kind: Deployment
metadata:
  name: mahfel-web
spec:
  replicas: 1
  selector:
    matchLabels: {app: mahfel-web}
  template:
    metadata:
      labels: {app: mahfel-web}
    spec:
      hostAliases:
        - ip: 192.0.2.2
          hostnames: [auth.mahfel.localhost]
      containers:
        - name: web
          image: mahfel-web:local
          imagePullPolicy: Never
          env:
            - {name: MAHFEL_RENDER_ASSET_ORIGINS, value: "http://rustfs:9000"}
            - name: MAHFEL_RENDER_API_KEY
              valueFrom: {secretKeyRef: {name: local-credentials, key: recording-render-key}}
            - {name: NEXTAUTH_URL, value: 'https://mahfel.localhost'}
            - name: NEXTAUTH_SECRET
              valueFrom: {secretKeyRef: {name: local-credentials, key: nextauth-secret}}
            - {name: KEYCLOAK_ISSUER, value: 'https://auth.mahfel.localhost/realms/rastai'}
            - {name: KEYCLOAK_CLIENT_ID, value: mahfel-web}
            - name: KEYCLOAK_CLIENT_SECRET
              valueFrom: {secretKeyRef: {name: local-credentials, key: keycloak-web-client-secret}}
            - {name: MAHFEL_API_URL, value: 'http://mahfel-api:8080'}
            - {name: NODE_EXTRA_CA_CERTS, value: /certs/root.crt}
          ports: [{containerPort: 3000}]
          startupProbe:
            httpGet: {path: /api/health, port: 3000}
            failureThreshold: 30
            periodSeconds: 5
          readinessProbe:
            httpGet: {path: /api/health, port: 3000}
          volumeMounts: [{name: local-ca, mountPath: /certs/root.crt, subPath: root.crt, readOnly: true}]
      volumes: [{name: local-ca, configMap: {name: local-ca}}]
---
apiVersion: v1
kind: Service
metadata:
  name: mahfel-web
spec:
  selector: {app: mahfel-web}
  ports: [{port: 3000}]
