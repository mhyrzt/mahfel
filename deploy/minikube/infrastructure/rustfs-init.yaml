apiVersion: batch/v1
kind: Job
metadata:
  name: rustfs-init
spec:
  backoffLimit: 5
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: create-bucket
          image: docker.arvancloud.ir/amazon/aws-cli:2.36.46
          command: [sh, -c]
          args:
            - |
              until aws --endpoint-url http://rustfs:9000 s3api head-bucket --bucket mahfel-local 2>/dev/null ||
              aws --endpoint-url http://rustfs:9000 s3api create-bucket --bucket mahfel-local;
              do sleep 3; done
              aws --endpoint-url http://rustfs:9000 s3api put-bucket-cors --bucket mahfel-local --cors-configuration '{"CORSRules":[{"AllowedOrigins":["https://mahfel.localhost"],"AllowedMethods":["PUT","GET"],"AllowedHeaders":["*"],"ExposeHeaders":["ETag"],"MaxAgeSeconds":300}]}'
              aws --endpoint-url http://rustfs:9000 s3api put-bucket-lifecycle-configuration --bucket mahfel-local --lifecycle-configuration '{"Rules":[{"ID":"expire-abandoned-uploads","Filter":{"Prefix":"uploads/"},"Status":"Enabled","Expiration":{"Days":1}}]}'
          env:
            - {name: AWS_ACCESS_KEY_ID, value: mahfel}
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom: {secretKeyRef: {name: local-credentials, key: rustfs-secret-key}}
            - {name: AWS_DEFAULT_REGION, value: us-east-1}
            - {name: AWS_EC2_METADATA_DISABLED, value: 'true'}
