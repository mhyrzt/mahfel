apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: rabbitmq-data
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rabbitmq
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels: {app: rabbitmq}
  template:
    metadata:
      labels: {app: rabbitmq}
    spec:
      containers:
        - name: rabbitmq
          image: docker.arvancloud.ir/rabbitmq:4.2-management-alpine
          env:
            - {name: RABBITMQ_DEFAULT_USER, value: mahfel}
            - name: RABBITMQ_DEFAULT_PASS
              valueFrom: {secretKeyRef: {name: local-credentials, key: rabbitmq-password}}
          ports: [{containerPort: 5672}, {containerPort: 15672}]
          readinessProbe:
            exec: {command: [rabbitmq-diagnostics, -q, ping]}
            periodSeconds: 10
            timeoutSeconds: 10
          volumeMounts: [{name: data, mountPath: /var/lib/rabbitmq}]
      volumes: [{name: data, persistentVolumeClaim: {claimName: rabbitmq-data}}]
---
apiVersion: v1
kind: Service
metadata:
  name: rabbitmq
spec:
  selector: {app: rabbitmq}
  ports:
    - {name: amqp, port: 5672}
    - {name: management, port: 15672}
