apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: caddy-data
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: caddy
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels: {app: caddy}
  template:
    metadata:
      labels: {app: caddy}
    spec:
      containers:
        - name: caddy
          image: docker.arvancloud.ir/caddy:2.11.4-alpine
          env:
            - {name: MAHFEL_CADDY_WEB_UPSTREAM, value: 'mahfel-web:3000'}
            - {name: MAHFEL_CADDY_API_UPSTREAM, value: 'mahfel-api:8080'}
          ports: [{containerPort: 80, hostPort: 80}, {containerPort: 443, hostPort: 443}]
          readinessProbe:
            httpGet: {path: /config/, port: 2019}
            periodSeconds: 5
          volumeMounts:
            - {name: config, mountPath: /etc/caddy/Caddyfile, subPath: Caddyfile, readOnly: true}
            - {name: config, mountPath: /etc/caddy/base.Caddyfile, subPath: base.Caddyfile, readOnly: true}
            - {name: page, mountPath: /srv/caddy/index.html, subPath: index.html, readOnly: true}
            - {name: data, mountPath: /data}
      volumes:
        - {name: config, configMap: {name: caddy-config}}
        - {name: page, configMap: {name: caddy-index}}
        - {name: data, persistentVolumeClaim: {claimName: caddy-data}}
---
apiVersion: v1
kind: Service
metadata:
  name: caddy
spec:
  selector: {app: caddy}
  ports:
    - {name: http, port: 80, targetPort: 80}
    - {name: https, port: 443, targetPort: 443}
