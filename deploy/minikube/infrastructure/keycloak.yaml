apiVersion: apps/v1
kind: Deployment
metadata:
  name: keycloak
spec:
  replicas: 1
  selector:
    matchLabels: {app: keycloak}
  template:
    metadata:
      labels: {app: keycloak}
    spec:
      containers:
        - name: keycloak
          image: quay.io/keycloak/keycloak:26.7.4
          args: [start-dev, --import-realm, --db=dev-mem, --http-enabled=true, --hostname=https://auth.mahfel.localhost, --hostname-backchannel-dynamic=true, --proxy-headers=xforwarded, --health-enabled=true]
          ports: [{containerPort: 8080}]
          readinessProbe:
            tcpSocket: {port: 8080}
            periodSeconds: 10
            initialDelaySeconds: 20
          volumeMounts: [{name: realm, mountPath: /opt/keycloak/data/import, readOnly: true}]
      volumes: [{name: realm, configMap: {name: keycloak-realm}}]
---
apiVersion: v1
kind: Service
metadata:
  name: keycloak
spec:
  selector: {app: keycloak}
  ports: [{port: 8080}]
