apiVersion: apps/v1
kind: Deployment
metadata:
  name: coturn
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels: {app: coturn}
  template:
    metadata:
      labels: {app: coturn}
    spec:
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      containers:
        - name: coturn
          image: docker.arvancloud.ir/coturn/coturn:4.7.0-r0
          args:
            - --log-file=stdout
            - --fingerprint
            - --lt-cred-mech
            - --use-auth-secret
            - --static-auth-secret=mahfel-local-only-turn-secret
            - --realm=mahfel.local
            - --external-ip=192.0.2.1
            - --min-port=49160
            - --max-port=49200
            - --no-tls
            - --no-dtls
          ports:
            - {containerPort: 3478, protocol: UDP}
            - {containerPort: 3478, protocol: TCP}
