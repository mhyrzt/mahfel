global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: mahfel-api
    static_configs:
      - targets: ["mahfel-api:9101"]
  - job_name: mahfel-media
    static_configs:
      - targets: ["mahfel-media:9102"]
  - job_name: mahfel-worker
    static_configs:
      - targets: ["mahfel-worker:9103"]
  - job_name: rabbitmq
    static_configs:
      - targets: ["rabbitmq:15692"]
