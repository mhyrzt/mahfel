<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Mahfel Caddy</title>
    <style>
      :root {
        color-scheme: light;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #f8fafc;
        color: #172033;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        background: #f8fafc;
      }

      main {
        width: min(100%, 680px);
        padding: 48px;
        border: 1px solid #e2e8f0;
        border-radius: 16px;
        background: #ffffff;
        box-shadow: 0 12px 32px rgba(15, 23, 42, 0.06);
      }

      .eyebrow {
        margin: 0 0 16px;
        color: #64748b;
        font-size: 0.78rem;
        font-weight: 700;
        letter-spacing: 0.18em;
        text-transform: uppercase;
      }

      h1 {
        margin: 0;
        font-size: clamp(2.4rem, 8vw, 4rem);
        letter-spacing: -0.05em;
        line-height: 1;
      }

      p {
        margin: 20px 0 0;
        color: #64748b;
        font-size: 1.08rem;
        line-height: 1.7;
      }

      ul {
        margin: 24px 0 0;
        padding-left: 24px;
      }

      li {
        padding: 4px 0;
      }

      a {
        color: #4f46e5;
        text-decoration: none;
      }

      a:hover {
        color: #3730a3;
      }

      .status {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        margin-top: 28px;
        padding: 8px 12px;
        border-radius: 999px;
        background: #ecfdf5;
        color: #047857;
        font-size: 0.9rem;
        font-weight: 600;
      }

      .status::before {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: #10b981;
        content: "";
      }

      @media (max-width: 520px) {
        main {
          padding: 34px 26px;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <p class="eyebrow">Local edge gateway</p>
      <h1>Mahfel Caddy</h1>
      <p>Local HTTPS reverse proxy is running.</p>
      <div class="status">Online and ready</div>
      <ul>
        <li><a href="https://mahfel.localhost">Mahfel web application</a></li>
        <li><a href="https://api.mahfel.localhost">Mahfel API</a></li>
        <li><a href="https://auth.mahfel.localhost">Dex authentication</a></li>
        <li><a href="https://s3.mahfel.localhost">RustFS S3 endpoint</a></li>
        <li><a href="https://storage.mahfel.localhost">RustFS console</a></li>
        <li><a href="https://rabbitmq.mahfel.localhost">RabbitMQ management</a></li>
      </ul>
    </main>
  </body>
</html>
