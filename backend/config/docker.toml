# Container-network profile. Shared defaults remain in default.toml.
[api]
media_grpc_url = "http://mahfel-media:50051"
allowed_origin = "https://mahfel.localhost"
trusted_proxy = "caddy"

[database]
host = "postgres"
port = 5432
user = "mahfel"
password = "mahfel-local-only"
name = "mahfel"

[worker]
amqp_url = "amqp://mahfel:mahfel-local-only@rabbitmq:5672/%2f"

[worker.exports]
renderer_url = "http://mahfel-web:3000/api/internal/recording-render"
