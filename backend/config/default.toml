[api]
http_bind = "0.0.0.0:8080"
operations_bind = "0.0.0.0:9101"
media_grpc_url = "http://mahfel-media:50051"
media_registry_bind = "0.0.0.0:50052"
# Local development fixture only. Override from a secret in non-local deployments.
media_registry_secret = "mahfel-local-only-media-registry-root"
allowed_origin = "https://mahfel.localhost"
# Unset: X-Forwarded-For is ignored and the socket peer is used.
# Set only to the address of the reverse proxy that actually sets the header.
# trusted_proxy = "10.0.0.1"

[api.ws]
max_connections = 10000
outbound_capacity = 64
write_timeout_seconds = 10
heartbeat_interval_seconds = 15
heartbeat_timeout_seconds = 45
auth_timeout_seconds = 10
max_message_bytes = 65536

[oidc]
issuer_url = "https://auth.mahfel.localhost/realms/rastai"
# Optional IP override for issuer discovery and JWKS requests; issuer validation still uses issuer_url.
# issuer_resolve_ip = "127.0.0.1"
# issuer_ca_cert_path = "/path/to/local-ca.pem"
client_id = "mahfel-api"
client_secret = "mahfel-dev-secret"
redirect_uri = "https://api.mahfel.localhost/v1/auth/oidc/callback"
scopes = ["openid", "profile", "email", "roles"]

[keycloak]
base_url = "https://auth.mahfel.localhost"
realm = "rastai"
admin_client_id = "mahfel-admin"
admin_client_secret = "mahfel-admin-dev-secret"

[database]
host = "postgres"
port = 5432
user = "mahfel"
password = "mahfel-local-only"
name = "mahfel"
min_connections = 1
max_connections = 10
acquire_timeout_seconds = 5
idle_timeout_seconds = 600
max_lifetime_seconds = 1800
migrate_on_start = false

[storage]
internal_endpoint = "http://rustfs:9000"
public_endpoint = "https://s3.mahfel.localhost"
region = "us-east-1"
bucket = "mahfel-local"
access_key = "mahfel"
secret_key = "mahfel-local-only-secret"
force_path_style = true

[media]
grpc_bind = "0.0.0.0:50051"
operations_bind = "0.0.0.0:9102"
worker_count = 4
rtc_port_min = 40000
rtc_port_max = 40003
listen_ip = "0.0.0.0"
announced_address = "127.0.0.1"
node_id = "media-local"
grpc_advertise_url = "http://mahfel-media:50051"
registry_url = "http://mahfel-api:50052"
# HMAC-SHA256(root secret, node_id), base64 encoded; local fixture only.
registry_token = "Td0OQcFbnUqRwYXw7THJiokrZJX/vpbeez+l3f0Hvzc="
max_rooms = 100

[redis]
url = "redis://redis:6379"
key_prefix = "mahfel"
connect_timeout_seconds = 5
command_timeout_seconds = 3

[worker]
operations_bind = "0.0.0.0:9103"
amqp_url = "amqp://mahfel:mahfel-local-only@rabbitmq:5672/%2f"
concurrency = 4
prefetch = 4
drain_timeout_seconds = 30

[telemetry]
log_filter = "info,tower_http=info"
otlp_endpoint = ""

[turn]
static_secret = "mahfel-local-only-turn-secret"
realm = "mahfel.local"
uris = ["turn:127.0.0.1:3478?transport=udp", "turn:127.0.0.1:3478?transport=tcp", "turns:127.0.0.1:5349?transport=tcp"]
ttl_seconds = 300
