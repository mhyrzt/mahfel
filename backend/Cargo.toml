[workspace]
members = [
  "bins/api",
  "bins/media",
  "bins/worker",
  "crates/application",
  "crates/auth",
  "crates/config",
  "crates/domain",
  "crates/media-client",
  "crates/messaging",
  "crates/postgres",
  "crates/rtc",
  "crates/rtc-protocol",
  "crates/telemetry",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "AGPL-3.0-or-later"

[workspace.dependencies]
anyhow = "1.0.104"
axum = { version = "0.8.9", features = ["json", "macros"] }
config = { version = "0.15.25", default-features = false, features = ["toml"] }
lapin = "4.10.0"
mediasoup = "0.27.0"
opentelemetry = "0.32.0"
opentelemetry-otlp = { version = "0.32.0", default-features = false, features = ["grpc-tonic", "trace"] }
opentelemetry_sdk = { version = "0.32.0", features = ["rt-tokio"] }
prometheus = { version = "0.14.0", features = ["process"] }
prost = "0.14.4"
protoc-bin-vendored = "3.2.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sqlx = { version = "0.9.0", default-features = false, features = ["macros", "migrate", "postgres", "runtime-tokio", "tls-rustls-ring-native-roots", "time", "uuid"] }
thiserror = "2.0.20"
time = { version = "0.3.55", features = ["serde"] }
tokio = { version = "1.53.1", features = ["full"] }
tokio-stream = { version = "0.1.17", features = ["net"] }
tonic = "0.14.6"
tonic-prost = "0.14.6"
tonic-prost-build = "0.14.6"
tower = "0.5.3"
tower-http = { version = "0.7.1", features = ["cors", "request-id", "trace"] }
tracing = "0.1.44"
tracing-opentelemetry = "0.33.0"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }
url = { version = "2.5.8", features = ["serde"] }
uuid = { version = "1.26.0", features = ["serde", "v4"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
unwrap_used = "deny"

[profile.release]
