site_name: Mahfel Engineering
site_description: Architecture, operations, and engineering roadmap for Mahfel
repo_name: mahfel
docs_dir: docs
strict: true
theme:
  name: material
  features:
    - navigation.sections
    - navigation.indexes
    - content.code.copy
markdown_extensions:
  - admonition
  - attr_list
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
nav:
  - Home: index.md
  - Development:
      - Getting started: development/getting-started.md
      - Repository structure: development/repository-structure.md
      - Conventions: development/conventions.md
      - Testing: development/testing.md
      - Recording spike: development/recording-spike.md
      - Recording MP4 exports: development/recording-export.md
      - Continuous integration: development/ci.md
  - Deployment:
      - Local: deployment/local.md
      - Kubernetes production: deployment/kubernetes.md
      - Local Kubernetes: deployment/minikube.md
      - Background jobs: deployment/background-jobs.md
      - Recordings: deployment/recordings.md
  - Architecture:
      - Overview: architecture/overview.md
      - Components: architecture/components.md
      - Chat: architecture/chat.md
      - Collaboration: architecture/collaboration.md
      - Networking: architecture/networking.md
      - Data flow: architecture/data-flow.md
      - Files: architecture/files.md
      - Observability: architecture/observability.md
      - Scaling: architecture/scaling.md
